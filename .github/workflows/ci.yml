name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      TREFLE_API_TOKEN: ${{ secrets.TREFLE_API_TOKEN }}
      NEXT_PUBLIC_SITE_URL: https://floratlas.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Production build
        run: npm run build
